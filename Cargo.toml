[package]
name = "ftw"
version = "0.3.0"
edition = "2021"
description = "Fuck Teh World (FTW) — Authorized Async TCP Port Scanner"
authors = ["hoytnix"]

[[bin]]
name = "ftw"
path = "src/main.rs"

# Metadata for `cargo packager`, used by .github/workflows/release.yml.
# Product name and bundle identifier; everything else (version, description,
# binary list) is derived from [package] above.
[package.metadata.packager]
product-name = "FTW"
identifier = "com.tehwiz.ftw"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
scraper = "0.24"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "1"
sha2 = "0.10"
x509-parser = "0.16"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
